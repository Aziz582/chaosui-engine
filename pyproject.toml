[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chaosui-engine"
version = "0.1.1"
description = "Intelligent UI Chaos Testing for Modern Web Applications: Simulating the Impatient, Chaotic Customer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Aziz582" }
]
keywords = [
    "chaos-engineering",
    "ui-testing",
    "playwright",
    "race-conditions",
    "ui-freeze",
    "front-end-testing",
    "monkey-testing-alternative"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "playwright>=1.40.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "jinja2>=3.1.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/Aziz582/chaosui-engine"
Repository = "https://github.com/Aziz582/chaosui-engine"
Issues = "https://github.com/Aziz582/chaosui-engine/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
chaosui = "chaosui.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["chaosui*"]

[tool.setuptools.package-data]
"chaosui.demo" = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
